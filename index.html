.item{background:rgba(255,255,255,.97);border:2px solid #e4e1ce;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;min-width:0;min-height:0;cursor:grab;user-select:none;touch-action:manipulation;transition:transform .15s,box-shadow .15s;position:relative;padding:3px;box-shadow:0 2px 4px #45647b12}
.item:active{cursor:grabbing}.item:hover{transform:translateY(-2px);box-shadow:0 5px 10px #426b8a30}.item img{width:90%;height:72%;object-fit:contain;pointer-events:none;mix-blend-mode:multiply}.item .name{font-weight:900;font-size:clamp(10px,1.4vw,17px);line-height:1.15;text-align:center;white-space:nowrap;color:#203951}.item.packed-source{visibility:hidden;pointer-events:none}.item.shake{animation:shake .45s ease}
#bagdrop{position:absolute;left:49%;top:13%;width:47%;height:73%;border-radius:28%;display:flex;align-items:center;justify-content:center;pointer-events:auto;transition:filter .2s}
#bagdrop.over{filter:drop-shadow(0 0 14px #ffe56b)}
#packed{position:absolute;left:7%;top:25%;width:86%;height:52%;display:flex;align-content:center;justify-content:center;align-items:center;flex-wrap:wrap;gap:clamp(3px,1vw,12px);pointer-events:none}
.packed-item{width:46%;height:47%;background:#ffffffb8;border:2px solid #ffffffed;border-radius:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px #25516a24;animation:pop .4s cubic-bezier(.2,1.7,.5,1)}.packed-item img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
#feedback{position:absolute;left:49%;top:4%;width:47%;text-align:center;font-size:clamp(14px,2vw,25px);font-weight:1000;color:#fff;text-shadow:0 2px 3px #1d5e8c;pointer-events:none;min-height:1.5em}
#toolbar{position:absolute;right:2%;top:2%;display:flex;gap:6px;z-index:4}button{font:inherit;cursor:pointer;border:0;border-radius:999px;background:#fff5d7;color:#24486a;font-weight:900;padding:8px 12px;box-shadow:0 2px 5px #25516a30}#sound{font-size:clamp(12px,1.3vw,16px)}#reset{font-size:clamp(11px,1.2vw,15px)}
#progress{position:absolute;left:51%;bottom:5%;width:42%;font-size:clamp(11px,1.4vw,17px);font-weight:900;text-align:center;color:#244a35;background:#fff8c9dc;border:2px solid #c9dba0;border-radius:999px;padding:7px 6px}
#hint{position:absolute;left:49%;bottom:0.5%;width:47%;font-size:clamp(9px,1.05vw,13px);text-align:center;color:#28506b;font-weight:800;pointer-events:none}
#toast{position:absolute;left:27%;top:44%;width:46%;padding:14px 10px;border-radius:22px;background:#fffdf0;border:4px solid #ffd95e;box-shadow:0 6px 20px #1c4b5c38;text-align:center;font-weight:1000;font-size:clamp(18px,3vw,36px);color:#267a43;display:none;z-index:5;animation:pop .35s ease}
#toast small{display:block;font-size:.48em;color:#31516b;margin-top:5px}
#celebration{position:absolute;inset:0;z-index:10;display:none;pointer-events:none;overflow:hidden;background:radial-gradient(ellipse at center,rgba(255,231,109,.5),rgba(255,255,255,.12) 55%,transparent 75%)}
#celebration.show{display:block;animation:flash .8s ease-in-out 2}
#celebration .banner{position:absolute;left:18%;top:32%;width:64%;padding:18px 8px;border:5px solid #ffcf35;border-radius:28px;background:linear-gradient(135deg,#fff9c9,#fff);color:#168244;text-align:center;font-size:clamp(28px,6vw,68px);font-weight:1000;text-shadow:0 3px #ffe47c;box-shadow:0 8px 0 #f3b82e,0 12px 30px #20445c55;animation:pop .55s cubic-bezier(.2,1.7,.5,1)}
.star{position:absolute;top:-12%;font-size:clamp(24px,4vw,52px);animation:starfall var(--dur,2.4s) linear forwards;filter:drop-shadow(0 2px 2px #ffffffaa)}
@keyframes starfall{to{transform:translateY(125vh) rotate(720deg);opacity:.2}}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.78}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}@keyframes pop{0%{transform:scale(.65);opacity:.2}100%{transform:scale(1);opacity:1}}
@media(max-width:600px){body{padding:0;align-items:flex-start}#game{width:100vw;border-radius:0;aspect-ratio:3/2;margin-top:0}#items{gap:1%;} .item{border-radius:8px;border-width:1px}.item .name{font-size:clamp(8px,2.4vw,13px)}#packed{gap:2px}.packed-item{border-radius:6px;border-width:1px}button{padding:5px 8px}#progress{padding:4px} }

const allItems=[
 {name:'김밥도시락',ok:true},{name:'과자',ok:true},{name:'음료수',ok:true},{name:'물',ok:true},
 {name:'장난감인형',ok:false},{name:'연필',ok:false},{name:'책',ok:false},{name:'곤충',ok:false},{name:'색연필',ok:false}
];
const itemsEl=document.querySelector('#items'), bag=document.querySelector('#bagdrop'), packed=document.querySelector('#packed'), feedback=document.querySelector('#feedback'), progress=document.querySelector('#progress'), toast=document.querySelector('#toast'), soundBtn=document.querySelector('#sound');
let chosen=null, packedNames=new Set(), soundOn=true, audioCtx=null, toastTimer=null;
function play(kind){if(!soundOn)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime;const notes=kind==='good'?[523,659,784,1047]:[180,130];notes.forEach((freq,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=kind==='good'?'sine':'sawtooth';o.frequency.setValueAtTime(freq,now+i*(kind==='good'?.105:.12));g.gain.setValueAtTime(.0001,now+i*(kind==='good'?.105:.12));g.gain.exponentialRampToValueAtTime(kind==='good'?.16:.12,now+i*(kind==='good'?.105:.12)+.02);g.gain.exponentialRampToValueAtTime(.0001,now+i*(kind==='good'?.105:.12)+(kind==='good'?.16:.2));o.connect(g);g.connect(audioCtx.destination);o.start(now+i*(kind==='good'?.105:.12));o.stop(now+i*(kind==='good'?.105:.12)+(kind==='good'?.18:.22));});}catch(e){}}
function playVictory(){if(!soundOn)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime;[[523,0],[659,.12],[784,.24],[1047,.38],[1318,.55],[1568,.72],[2093,.9]].forEach(([freq,delay])=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(freq,now+delay);g.gain.setValueAtTime(.0001,now+delay);g.gain.exponentialRampToValueAtTime(.24,now+delay+.025);g.gain.exponentialRampToValueAtTime(.0001,now+delay+.42);o.connect(g);g.connect(audioCtx.destination);o.start(now+delay);o.stop(now+delay+.44)});setTimeout(()=>{[880,1174,1568].forEach((freq,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.12,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.7);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.72)})},550)}catch(e){}}
function celebrate(){const layer=document.querySelector('#celebration');layer.classList.add('show');layer.style.display='block';for(let i=0;i<64;i++){const star=document.createElement('span');star.className='star';star.textContent=['⭐','✨','🌟','🎉','💛'][i%5];star.style.left=(Math.random()*100)+'%';star.style.animationDelay=(Math.random()*1.5)+'s';star.style.setProperty('--dur',(2+Math.random()*2.3)+'s');layer.appendChild(star)}playVictory();showToast('🎉 성공! 🎉','준비물을 모두 챙겼어요! 즐거운 체험학습을 떠나요!');setTimeout(()=>{layer.classList.remove('show');layer.style.display='none';layer.innerHTML='<div class="banner">🎉 성공! 🎉<div style="font-size:.38em;margin-top:8px">준비물을 모두 챙겼어요!</div></div>'},5200)}
function update(){progress.textContent=packedNames.size===4?'준비 완료! 즐거운 체험학습! 🎒':`가방에 준비물을 넣어 보세요! (${packedNames.size}/4)`;}
function say(msg,kind){feedback.textContent=msg;feedback.style.color=kind==='bad'?'#ffeff0':'#fff';}
function showToast(title,sub=''){toast.innerHTML=title+(sub?`<small>${sub}</small>`:'');toast.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.style.display='none',1900);}
function pack(item,source){if(!item||packedNames.has(item.name))return;chosen=null;if(item.ok){packedNames.add(item.name);source?.classList.add('packed-source');const chip=document.createElement('div');chip.className='packed-item';chip.innerHTML=`<img src="${ASSETS[item.name]}" alt="${item.name}">`;chip.title=item.name;packed.appendChild(chip);say('참 잘했어요! ✨','good');play('good');showToast('참 잘했어요! 🌟',item.name+'을(를) 가방에 넣었어요.');update();if(packedNames.size===4){say('성공! 준비물을 모두 챙겼어요! 🎉','good');celebrate();} }else{say('이건 가방에 넣지 않아요!','bad');play('bad');if(source){source.classList.remove('shake');void source.offsetWidth;source.classList.add('shake');setTimeout(()=>source.classList.remove('shake'),500)}showToast('앗, 다시 생각해 봐요!','체험학습에 꼭 필요한 준비물일까요?');}}
function makeItems(){itemsEl.innerHTML='';allItems.forEach(item=>{const card=document.createElement('div');card.className='item';card.draggable=true;card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label',item.name+' 가방에 넣기');card.innerHTML=`<img src="${ASSETS[item.name]}" alt=""><span class="name">${item.name}</span>`;card.addEventListener('dragstart',e=>{chosen=item.name;e.dataTransfer.setData('text/plain',item.name);e.dataTransfer.effectAllowed='move'});card.addEventListener('dragend',()=>{chosen=null});card.addEventListener('click',()=>{if(packedNames.has(item.name))return;chosen=item.name;document.querySelectorAll('.item').forEach(n=>n.style.outline='');card.style.outline='4px solid #ffca48';say(item.name+'을(를) 선택했어요. 가방을 눌러요!','good');});card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();chosen=item.name;say(item.name+'을(를) 선택했어요. 가방을 눌러요!','good')}});itemsEl.appendChild(card);});}
function trySelected(){if(!chosen)return;const item=allItems.find(x=>x.name===chosen);const source=[...document.querySelectorAll('.item')].find(n=>n.getAttribute('aria-label')===item.name+' 가방에 넣기');pack(item,source);document.querySelectorAll('.item').forEach(n=>n.style.outline='');}
bag.addEventListener('dragover',e=>{e.preventDefault();bag.classList.add('over');if(e.dataTransfer)e.dataTransfer.dropEffect='move'});bag.addEventListener('dragleave',()=>bag.classList.remove('over'));bag.addEventListener('drop',e=>{e.preventDefault();bag.classList.remove('over');const name=e.dataTransfer.getData('text/plain')||chosen;const item=allItems.find(x=>x.name===name);const source=[...document.querySelectorAll('.item')].find(n=>n.getAttribute('aria-label')===name+' 가방에 넣기');pack(item,source)});bag.addEventListener('click',trySelected);
soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊 소리 켬':'🔇 소리 끔';if(soundOn)play('good')});document.querySelector('#reset').addEventListener('click',()=>{packedNames.clear();packed.innerHTML='';chosen=null;feedback.textContent='';toast.style.display='none';const celebration=document.querySelector('#celebration');celebration.classList.remove('show');celebration.style.display='none';celebration.innerHTML='<div class="banner">🎉 성공! 🎉<div style="font-size:.38em;margin-top:8px">준비물을 모두 챙겼어요!</div></div>';makeItems();update();});makeItems();update();
</script></body></html>
